<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="shopping-container">
        <h1>Shopping List</h1>

        <div id="input-group">
            <input type="text" id="itemInput" placeholder="Item name...">
            <input type="number" id="itemCostInput" placeholder="Cost" min="0" step="0.01">
            <button id="addBtn">Add</button>
        </div>

        <div class="list-wrapper">
            <ul id="shoppingListContainer"></ul>
        </div>

        <div class="total-container">
            <span>Total Cost:</span>
            <span id="totalCostDisplay">Ksh 0.00</span>
        </div>

        <button id="clearBtn">Clear List</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
